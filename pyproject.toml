[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "thrift-scout"
version = "0.4.0"
description = "Chat with a browser agent that finds and compares listings (Mercari, SUUMO, ...)"
requires-python = ">=3.11"
license = "MIT"
dependencies = [  # the plugin server needs only these
    "httpx==0.28.1",
    "mcp==2.3.0",
]

[project.optional-dependencies]
agent = [  # web page and terminal chat (browser agent, multi-agent graph)
    "browser-use==1.0.5",
    "python-dotenv==1.2.4",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "langgraph==1.2.22",
]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0"]

[project.scripts]
thrift-scout = "watcher.cli:main"
thrift-scout-mcp = "watcher.mcp_server:main"

[tool.setuptools]
packages = ["watcher"]

[tool.setuptools.package-data]
watcher = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
pythonpath = ["."]
markers = ["live: hits the real shop sites (run with -m live)"]
